<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Saebom Park</title>
<meta name="description" content="Writing by Saebom Park.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a class="nav__brand" href="index.html">Saebom Park</a>
  <ul class="nav__links">
    <li><a href="index.html">Home</a></li>
    <li><a href="cv.html">CV</a></li>
    <li><a href="blog.html" aria-current="page">Blog</a></li>
  </ul>
</nav>

<main class="page page--narrow">

  <header class="masthead">
    <h1 class="masthead__name">Blog</h1>
    <p class="masthead__role">Notes on data, tutoring, and building things.</p>
  </header>

  <div class="blog-list" id="blog-list">
    <p class="blog-empty">Loading posts…</p>
  </div>

  <footer class="page__footer">
    <span>© 2026 Saebom Park</span>
    <span>Last updated August 2026</span>
  </footer>

</main>

<script src="posts-data.js"></script>
<script>
  (function () {
    const list = document.getElementById("blog-list");
    const posts = (window.POSTS || [])
      .slice()
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    if (posts.length === 0) {
      list.innerHTML = '<p class="blog-empty">No posts yet — check back soon.</p>';
      return;
    }

    const formatter = new Intl.DateTimeFormat("en-US", {
      year: "numeric",
      month: "short",
      day: "numeric",
    });

    list.innerHTML = posts
      .map((post) => {
        const displayDate = formatter.format(new Date(post.date + "T00:00:00"));
        const tag = post.tag
          ? `<span class="post-card__tag">${post.tag}</span>`
          : "";
        return `
          <a class="post-card" href="posts/${post.slug}.html">
            <div class="post-card__date">${displayDate}</div>
            <h2 class="post-card__title">${post.title}</h2>
            <p class="post-card__excerpt">${post.excerpt}</p>
            ${tag}
          </a>
        `;
      })
      .join("");
  })();
</script>

</body>
</html>
